[package]
name = "coding-crew-raul"
description = "Review, Assess, Understand & Learn — the TUI for the work"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "raul"
path = "src/main.rs"

[dependencies]
coding-crew-core.workspace = true
coding-crew-engine.workspace = true
coding-crew-theme.workspace = true
anyhow.workspace = true
crossterm.workspace = true
# `Paragraph::line_count` asks ratatui how tall a paragraph will be, so the
# Overview measures its text the way ratatui draws it.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
serde_json.workspace = true
# The syntect types the engine's assets are named with: raul derives a syntect
# theme per preset for the document's code tokens.
syntect.workspace = true
