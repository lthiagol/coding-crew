[workspace]
resolver = "3"
members = ["crates/core", "crates/talita", "crates/raul", "crates/engine", "crates/theme", "crates/hugo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["coding-crew contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
coding-crew-core = { path = "crates/core" }
coding-crew-engine = { path = "crates/engine" }
coding-crew-theme = { path = "crates/theme" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
mmdflux = { version = "2.5", default-features = false }
pulldown-cmark = "0.12"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
thiserror = "2"
toml = "0.9"
unicode-width = "0.2"
unicode-segmentation = "1"
unicodeit = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
